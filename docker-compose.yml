services:
  clickhouse_db:
    image: clickhouse/clickhouse-server:latest
    container_name: ai-lead-scalper-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./db/config:/etc/clickhouse-server/config.d
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: market_data
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 8g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host=localhost", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scalper_net

  bot_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-lead-scalper-backend
    restart: unless-stopped
    depends_on:
      clickhouse_db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse_db
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: market_data
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      PYTHONUNBUFFERED: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - scalper_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-lead-scalper-frontend
    restart: unless-stopped
    depends_on:
      bot_backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - scalper_net

networks:
  scalper_net:
    driver: bridge

volumes:
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
